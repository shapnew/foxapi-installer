# 三平台打包工作流:在 GitHub 的云端机器上分别构建 Windows / macOS / Linux 安装包
# 触发方式:GitHub 网页 → Actions → 选择本工作流 → Run workflow(手动点一下)
name: Build Installers

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: ""
          - platform: macos-latest
            name: macos
            # 同时包含 Intel 和 Apple Silicon 的通用包,所有 Mac 都能用
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            name: linux
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 添加 macOS 双架构目标
        if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust 编译缓存(加速二次构建)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建安装包
        run: pnpm tauri build ${{ matrix.args }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
